name: Build Android APK

# Runs automatically on every push to main, on pull requests, and can also
# be triggered manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ── Job 1: build libv2ray.aar from AndroidLibXrayLite source ──────────
  # This isn't on Maven Central, so we compile it fresh with Go + gomobile.
  # Cached by commit SHA so repeat builds are fast after the first one.
  build-xray-aar:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.vars.outputs.cache-key }}
    steps:
      - name: Get latest AndroidLibXrayLite commit SHA (for cache key)
        id: vars
        run: |
          SHA=$(git ls-remote https://github.com/2dust/AndroidLibXrayLite HEAD | cut -f1)
          echo "cache-key=xray-aar-$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache libv2ray.aar
        id: cache-aar
        uses: actions/cache@v4
        with:
          path: libv2ray.aar
          key: ${{ steps.vars.outputs.cache-key }}

      - name: Set up Go
        if: steps.cache-aar.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Android SDK + NDK
        if: steps.cache-aar.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.cache-aar.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Install gomobile
        if: steps.cache-aar.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Clone AndroidLibXrayLite
        if: steps.cache-aar.outputs.cache-hit != 'true'
        run: git clone --depth=1 https://github.com/2dust/AndroidLibXrayLite.git

      - name: Build libv2ray.aar
        if: steps.cache-aar.outputs.cache-hit != 'true'
        working-directory: AndroidLibXrayLite
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        # Exact steps per the upstream project's own README/pkg.go.dev docs
        # (checked at the time this workflow was written — if this step
        # starts failing, check https://github.com/2dust/AndroidLibXrayLite
        # for whether they've changed the recommended flags).
        run: |
          gomobile init
          go mod tidy -v
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o ../libv2ray.aar ./

      - name: Upload libv2ray.aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray-aar
          path: libv2ray.aar
          retention-days: 30

  # ── Job 2: build the APK itself ────────────────────────────────────────
  build-apk:
    needs: build-xray-aar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download libv2ray.aar
        uses: actions/download-artifact@v4
        with:
          name: libv2ray-aar
          path: app/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

        # No committed Gradle wrapper needed — setup-gradle provisions Gradle
        # itself, so this works even though this repo doesn't ship a
        # gradlew/gradle-wrapper.jar binary.
      - name: Build debug APK
        run: >
          gradle assembleDebug
          -PapiBaseUrl=${{ vars.API_BASE_URL || 'https://vpn-api.yourdomain.com' }}
          --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      # ── Optional: attach the APK to a GitHub Release when you push a tag ──
      # Push a tag like "v1.0.0" (git tag v1.0.0 && git push origin v1.0.0)
      # and this creates a Release with the APK ready to download.
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
