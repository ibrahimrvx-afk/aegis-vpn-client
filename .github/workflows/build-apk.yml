name: Build Android APK

# Runs automatically on every push to main, on pull requests, and can also
# be triggered manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ── Job 1: build libv2ray.aar from AndroidLibXrayLite source ──────────
  build-xray-aar:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest AndroidLibXrayLite commit SHA (for cache key)
        id: vars
        run: |
          SHA=$(git ls-remote https://github.com/2dust/AndroidLibXrayLite HEAD | cut -f1)
          echo "cache-key=xray-aar-v2-$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore cached libv2ray.aar
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: libv2ray.aar
          key: ${{ steps.vars.outputs.cache-key }}

      - name: Set up Go
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Android SDK + NDK
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Install gomobile
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Clone AndroidLibXrayLite
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: git clone --depth=1 https://github.com/2dust/AndroidLibXrayLite.git

      - name: Build libv2ray.aar
        if: steps.cache-restore.outputs.cache-hit != 'true'
        working-directory: AndroidLibXrayLite
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          gomobile init
          go mod tidy -v
          gomobile bind -v -androidapi 21 -ldflags='-s -w -checklinkname=0' -o ../libv2ray.aar ./

      - name: Verify the AAR actually exports libv2ray classes
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          test -s libv2ray.aar || { echo "::error::libv2ray.aar is missing or empty"; exit 1; }
          mkdir -p /tmp/aar-check && cd /tmp/aar-check
          unzip -o "$GITHUB_WORKSPACE/libv2ray.aar" classes.jar > /dev/null
          unzip -l classes.jar | grep -q 'libv2ray/CoreController.class' || {
            echo "::error::Built libv2ray.aar does not contain libv2ray/CoreController.class — the gomobile bind command or the Kotlin code using it likely needs updating to match a change upstream."
            unzip -l classes.jar | head -30
            exit 1
          }
          echo "AAR verified — libv2ray/CoreController.class present."

      - name: Save libv2ray.aar to cache (only reached if verification passed)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: libv2ray.aar
          key: ${{ steps.vars.outputs.cache-key }}

      - name: Upload libv2ray.aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray-aar
          path: libv2ray.aar
          retention-days: 30

  # ── Job 2: build the APK itself ────────────────────────────────────────
  build-apk:
    needs: build-xray-aar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download libv2ray.aar
        uses: actions/download-artifact@v4
        with:
          name: libv2ray-aar
          path: app/libs

      - name: Verify the downloaded AAR before spending build minutes on it
        run: |
          test -s app/libs/libv2ray.aar || { echo "::error::app/libs/libv2ray.aar missing or empty after download"; exit 1; }
          echo "Found app/libs/libv2ray.aar ($(du -h app/libs/libv2ray.aar | cut -f1))"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: >
          ./gradlew assembleDebug
          -PapiBaseUrl=${{ vars.API_BASE_URL || 'https://vpn-api.yourdomain.com' }}
          --no-daemon

      - name: Warn if API_BASE_URL was never set
        if: vars.API_BASE_URL == ''
        run: echo "::warning::API_BASE_URL repo variable is not set — this build points at the placeholder https://vpn-api.yourdomain.com, not your real backend. Set it under Settings > Secrets and variables > Actions > Variables."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
